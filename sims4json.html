<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌸JSONからValueだけ抜いて置き換え辞書用分割できるよツール✨</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:sans-serif; background:linear-gradient(135deg,#667eea,#764ba2); min-height:100vh; color:#333; }
    .container { max-width:1200px; margin:auto; padding:20px; }
    .header { text-align:center; color:#fff; margin-bottom:30px; }
    .header h1 { font-size:2.2em; text-shadow:2px 2px 5px rgba(0,0,0,.3); margin-bottom:10px;}
    .card { background:rgba(255,255,255,.95); border-radius:15px; padding:20px; margin-bottom:20px; }
    .drop-zone { border:3px dashed #667eea; border-radius:10px; padding:40px 20px; text-align:center; cursor:pointer; background:#fafaff; transition:.3s;}
    .drop-zone:hover { background:#f0f0ff; border-color:#764ba2;}
    .file-input{display:none;}
    .btn { background:linear-gradient(135deg,#667eea,#764ba2); color:#fff; border:none; padding:10px 20px; border-radius:20px; cursor:pointer; margin:5px; }
    .btn:hover { box-shadow:0 4px 10px rgba(0,0,0,0.3);}
    .log{background:#111;color:#0f0;padding:10px;height:200px;overflow:auto;display:none;white-space:pre-wrap;font-size:14px;}
    .file-item{background:#f8f9ff;padding:10px;margin:5px 0;border-left:4px solid #667eea;border-radius:10px;display:flex;justify-content:space-between;align-items:center;}
    .download-btn{background:#52c41a;color:white;border:none;padding:5px 12px;border-radius:15px;cursor:pointer;}
    .settings {display:grid;grid-template-columns:repeat(auto-fit, minmax(250px, 1fr));gap:15px;}
    .setting-group {background:#f8f9ff;padding:10px;border-radius:10px;border-left:4px solid #667eea;}
    .setting-group label{font-weight:bold;display:block;margin-bottom:5px;}
    .setting-group small{font-size:12px;color:#555;}
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🌸JSONからValueだけ抜いて置き換え辞書用分割できるよツール✨</h1>
    <p>翻訳用のValue抽出やJSON分割リライト簡易翻訳可能</p>
  </div>

  <div class="card">
    <div class="drop-zone" id="dropZone" onclick="fileInput.click()">
      <div>📁 JSONファイルをここにドロップ or クリック</div>
      <input type="file" id="fileInput" class="file-input" accept=".json" multiple>
    </div>
  </div>

  <div class="card">
    <h3>⚙️ 分割設定</h3>
    <div class="settings">
      <div class="setting-group">
        <label for="maxLines">1ファイルの最大行数 📏</label>
        <input type="number" id="maxLines" value="1000" min="100" max="5000">
        <small>デフォルト: 1000行（aiに頼むとちょうど良いサイズ♪）</small>
      </div>
      <div class="setting-group">
        <label for="splitMode">分割モード ✂️</label>
        <select id="splitMode">
          <option value="smart">スマート分割（推奨）</option>
          <option value="object">オブジェクト単位</option>
          <option value="array">配列単位</option>
          <option value="line">行数指定</option>
        </select>
        <small>シムズモッドなら「スマート分割」がおすすめ〜</small>
      </div>
      <div class="setting-group">
        <label for="naming">ファイル名形式 🏷️</label>
        <select id="naming">
          <option value="part">part01, part02...</option>
          <option value="function">機能別</option>
          <option value="category">カテゴリ別</option>
        </select>
        <small>後でリライトしやすい名前にするよ♪</small>
      </div>
      <div class="setting-group">
        <label>🌸 自動翻訳リライト簡易翻訳 🎌</label>
        <input type="checkbox" id="autoTranslate"> 分割と同時に日本語翻訳する
        <small>nonamesims4作翻訳設定で自動簡リライト簡易翻訳♪</small>
      </div>
    </div>
  </div>

  <div class="card"><div class="log" id="log"></div></div>

  <div class="card" id="results" style="display:none;">
    <h3>✨ 処理結果</h3>
    <div id="fileList"></div>
  </div>

  <!-- AIリライト依頼文 -->
  <div class="card">
    <h3 style="cursor:pointer;" onclick="toggleInstruction()">📜 AIリライト依頼文（クリックで展開/非表示）</h3>
    <p id="aiHint" style="display:none;">AIに投げてリライト依頼する用テキスト</p>
    <div id="instructionBox" style="display:none;">
      <textarea id="aiInstruction" readonly style="width:100%;height:300px;">
👉 ここに依頼文＆タグ辞書をそのまま配置
      </textarea>
      <button class="btn" onclick="copyInstruction()">📋 コピペする</button>
    </div>
  </div>
</div>

<script>
let splitFiles = [];
const translationDict = {
  '{M0.HE}':'{M0.彼}','{M0.HIS}':'{M0.彼}',"{M0.HE'S}":"{M0.彼}",
  '{F0.SHE}':'{F0.彼女}','{F0.HER}':'{F0.彼女}',"{F0.SHE'S}":"{F0.彼女}",
  '{M1.HE}':'{M1.彼}','{M1.HIS}':'{M1.彼}', '{F1.SHE}':'{F1.彼女}','{F1.HER}':'{F1.彼女}'
};
const dropZone=document.getElementById("dropZone"), fileInput=document.getElementById("fileInput"), log=document.getElementById("log");

function addLog(msg,type="info"){
  log.style.display="block"; log.innerHTML+="["+new Date().toLocaleTimeString()+"] "+msg+"\n"; log.scrollTop=log.scrollHeight;
}
dropZone.addEventListener("dragover",e=>{e.preventDefault();});
dropZone.addEventListener("drop",e=>{
  e.preventDefault();
  const files=[...e.dataTransfer.files].filter(f=>f.name.endsWith(".json"));
  if(files.length>0 && confirm("選択したJSONファイルを処理しますか？")) processFiles(files);
});
fileInput.addEventListener("change",e=>{
  const files=[...e.target.files];
  if(files.length>0 && confirm("選択したJSONファイルを処理しますか？")) processFiles(files);
});

async function processFiles(files){ splitFiles=[];
  for(const file of files){
    addLog("📁 "+file.name+" 読込中...");
    try{ const text=await file.text(); const json=JSON.parse(text); await splitJsonData(json,file.name); }
    catch(err){ addLog("❌ "+err.message,"error"); }
  } showResults();
}
async function splitJsonData(jsonData,originalFileName){
  const maxLines=parseInt(document.getElementById("maxLines").value);
  const splitMode=document.getElementById("splitMode").value;
  const naming=document.getElementById("naming").value;
  const autoTranslate=document.getElementById("autoTranslate").checked;
  const baseName=originalFileName.replace(/\.json$/,"");
  let index=1;
  if(splitMode==="array" && Array.isArray(jsonData)){
    for(const chunk of jsonData){
      let data=autoTranslate?translateJson(chunk):chunk;
      await saveFile(JSON.stringify(data,null,2),makeFileName(baseName,index++,naming));
    }
  } else if(splitMode==="object" && typeof jsonData==="object"){
    for(const key in jsonData){
      let data=autoTranslate?translateJson(jsonData[key]):jsonData[key];
      await saveFile(JSON.stringify({[key]:data},null,2),makeFileName(baseName+"_"+key,index++,naming));
    }
  } else if(splitMode==="line"){
    const lines=JSON.stringify(jsonData,null,2).split("\n"); let chunk=[];
    for(let i=0;i<lines.length;i++){
      chunk.push(lines[i]);
      if((i+1)%maxLines===0){ await saveFile(chunk.join("\n"),makeFileName(baseName,index++,naming)); chunk=[];}
    }
    if(chunk.length>0){await saveFile(chunk.join("\n"),makeFileName(baseName,index++,naming));}
  } else {
    await saveFile(JSON.stringify(autoTranslate?translateJson(jsonData):jsonData,null,2),baseName+"_full.json");
  }
}

function translateJson(obj){
  if(typeof obj==="string"){
    let out=obj;
    for(const eng in translationDict){
      out=out.replace(new RegExp(eng.replace(/[{}]/g,"\\$&"),"gi"),translationDict[eng]);
    } return out;
  } else if(Array.isArray(obj)){ return obj.map(translateJson);}
  else if(typeof obj==="object" && obj) {const res={}; for(const k in obj){res[k]=translateJson(obj[k]);} return res;}
  return obj;
}

function makeFileName(baseName,index,naming){
  if(naming==="part"){ return `${baseName}_part${String(index).padStart(2,"0")}.json`; }
  if(naming==="function"){ return `${baseName}_func${index}.json`; }
  if(naming==="category"){ return `${baseName}_cat${index}.json`; }
  return `${baseName}_${index}.json`;
}

async function saveFile(content,fileName){
  const blob=new Blob([content],{type:"text/plain"});
  splitFiles.push({name:fileName,blob:blob,size:blob.size});
}

function showResults(){
  document.getElementById("results").style.display="block";
  const fileList=document.getElementById("fileList"); fileList.innerHTML="";
  splitFiles.forEach((f,i)=>{
    const div=document.createElement("div"); div.className="file-item";
    div.innerHTML=`<div>${f.name} (${(f.size/1024).toFixed(1)}KB)</div>
      <button class="download-btn" onclick="downloadFile(${i})">📥DL</button>`;
    fileList.appendChild(div);
  });
}
function downloadFile(i){ const f=splitFiles[i];
  const url=URL.createObjectURL(f.blob); const a=document.createElement("a");
  a.href=url; a.download=f.name; a.click(); URL.revokeObjectURL(url);
}

function toggleInstruction(){
  const box=document.getElementById("instructionBox"), hint=document.getElementById("aiHint");
  const show=box.style.display==="none"; box.style.display=show?"block":"none"; hint.style.display=show?"block":"none";
}
function copyInstruction(){ const ta=document.getElementById("aiInstruction");
  ta.select(); document.execCommand("copy");
  alert("✅ コピペ用テキストをコピーしました！");
}
</script>
</body>
</html>
