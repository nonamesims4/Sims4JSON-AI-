<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sims 4 プロ翻訳ツール v3.2</title>
    <!-- 必要なライブラリをCDNから読み込み -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons (アイコン用) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { 
            font-family: 'Inter', 'sans-serif'; 
            background-color: #020617; /* slate-950 */
        }
        .font-monospace { font-family: 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'; }
        /* スクロールバーのカスタマイズ */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // 定数設定
        const MODEL_NAME = "gemini-2.5-flash-preview-09-2025";
        const CHUNK_SIZE = 30;
        const apiKey = ""; // 実行時に環境から供給されます

        const SYSTEM_PROMPT = `あなたは The Sims 4 に特化したプロのゲーム翻訳者です。
前後の文脈を推測し、すべてのテキストを日本語に翻訳してください。
【重要】英語がそのまま残ることは絶対に避けてください。たとえ1単語でも必ず日本語にします。

# 翻訳方針
- 自然な日本語。UIは簡潔に、セリフは口語的に。
- 三点リーダー「…」は絶対に使わない。
- 「Summon {2.SimFirstName}」→「{2.SimFirstName}を召喚する」のように、短いシステム文も必ず翻訳すること。

# お手本スタイル（厳守）
- 魔法的表現: 「祭器（アサメイ）」「苦悶」「神聖エネルギー」「慈悲深くも」など。
- タグ処理: '{M0.HE}{F0.SHE}' -> '{M0.彼}{F0.彼女}'。
- タグと助詞の結合: 「{0.SimFirstName}は」「{M0.彼}{F0.彼女}の」など。
- 二重助詞の防止: 「彼のの」→「彼の」に修正。

# 出力形式
必ず有効なJSON形式で返してください。キーは原文のまま、値のみを翻訳後の日本語にします。
未翻訳の項目を絶対に作らないでください。`;

        function App() {
            const [sourceData, setSourceData] = useState({});
            const [translatedData, setTranslatedData] = useState({});
            const [isRunning, setIsRunning] = useState(false);
            const [progress, setProgress] = useState(0);
            const [logs, setLogs] = useState([{ msg: "待機中... 英語残りがあるファイルも再翻訳可能です。", type: "info", time: new Date().toLocaleTimeString() }]);
            const stopRef = useRef(false);

            // Lucideアイコンの初期化
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [logs, progress, isRunning]);

            const addLog = (msg, type = "info") => {
                setLogs(prev => [{ msg, type, time: new Date().toLocaleTimeString() }, ...prev].slice(0, 50));
            };

            const handleFileUpload = async (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;

                let combined = {};
                for (const file of files) {
                    try {
                        const text = await file.text();
                        const json = JSON.parse(text);
                        Object.assign(combined, json);
                    } catch (err) {
                        addLog(`${file.name} の読み込みに失敗しました。`, "error");
                    }
                }
                setSourceData(combined);
                setTranslatedData({});
                addLog(`${Object.keys(combined).length} 件のデータを読み込みました。`, "success");
            };

            const translateChunk = async (chunk) => {
                let delay = 1000;
                for (let i = 0; i < 5; i++) {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: JSON.stringify(chunk) }] }],
                                systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
                                generationConfig: { responseMimeType: "application/json" }
                            })
                        });

                        if (!response.ok) throw new Error(`API Error: ${response.status}`);
                        const result = await response.json();
                        const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                        return JSON.parse(text);
                    } catch (err) {
                        if (i === 4) throw err;
                        await new Promise(r => setTimeout(r, delay));
                        delay *= 2;
                    }
                }
            };

            const startTranslation = async () => {
                setIsRunning(true);
                stopRef.current = false;
                addLog("翻訳プロセスを開始します。未翻訳箇所を徹底修正します。");

                const allKeys = Object.keys(sourceData);
                const total = allKeys.length;
                let currentTranslated = { ...translatedData };

                for (let i = 0; i < total; i += CHUNK_SIZE) {
                    if (stopRef.current) {
                        addLog("ユーザーにより停止されました。");
                        break;
                    }

                    const chunkKeys = allKeys.slice(i, i + CHUNK_SIZE);
                    const chunk = {};
                    chunkKeys.forEach(k => chunk[k] = sourceData[k]);

                    try {
                        const result = await translateChunk(chunk);
                        Object.assign(currentTranslated, result);
                        setTranslatedData({ ...currentTranslated });
                        const currentCount = Object.keys(currentTranslated).length;
                        setProgress(Math.floor((currentCount / total) * 100));
                        addLog(`${currentCount} / ${total} 件の処理を完了`);
                    } catch (err) {
                        addLog(`エラーが発生しました: ${err.message}`, "error");
                        break;
                    }
                }

                setIsRunning(false);
                addLog("すべての処理が完了しました。", "success");
            };

            const downloadJson = () => {
                const blob = new Blob([JSON.stringify(translatedData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `sims4_fixed_translation_${new Date().getTime()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            return (
                <div className="min-h-screen text-slate-200 p-4 md:p-8">
                    <div className="max-w-4xl mx-auto space-y-6">
                        <header className="text-center space-y-2">
                            <h1 className="text-3xl font-bold text-violet-400">Sims 4 プロ翻訳ツール v3.2</h1>
                            <p className="text-slate-400 text-sm">英語残りを許さない、徹底日本語化エディション</p>
                        </header>

                        {/* メイン操作パネル */}
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
                            <div className="flex flex-wrap gap-4 items-center">
                                <label className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg cursor-pointer transition text-sm">
                                    <i data-lucide="file-json" className="text-violet-400 w-5 h-5"></i>
                                    <span>JSONを選択</span>
                                    <input type="file" className="hidden" accept=".json" multiple onChange={handleFileUpload} />
                                </label>

                                <button 
                                    onClick={startTranslation}
                                    disabled={isRunning || Object.keys(sourceData).length === 0}
                                    className="flex items-center gap-2 bg-violet-600 hover:bg-violet-500 disabled:opacity-30 px-6 py-2 rounded-lg font-bold transition text-white"
                                >
                                    {isRunning ? <i data-lucide="loader-2" className="animate-spin w-5 h-5"></i> : <i data-lucide="play" className="w-5 h-5"></i>}
                                    開始
                                </button>

                                <button 
                                    onClick={() => stopRef.current = true}
                                    disabled={!isRunning}
                                    className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 px-4 py-2 rounded-lg transition"
                                >
                                    <i data-lucide="pause" className="w-5 h-5"></i>
                                    停止
                                </button>

                                <div className="flex-grow min-w-[200px]">
                                    <div className="flex justify-between text-xs mb-1 text-slate-400">
                                        <span>進捗: {progress}%</span>
                                        <span>{Object.keys(translatedData).length} / {Object.keys(sourceData).length}</span>
                                    </div>
                                    <div className="h-2 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                                        <div className="h-full bg-gradient-to-r from-violet-600 to-fuchsia-500 transition-all duration-300" style={{ width: `${progress}%` }} />
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* ログ & 情報 */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="md:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col h-[450px] shadow-lg">
                                <div className="p-4 border-b border-slate-800 bg-slate-900/80 flex justify-between items-center">
                                    <h3 className="font-bold flex items-center gap-2">
                                        <i data-lucide="terminal" className="text-violet-400 w-5 h-5"></i>
                                        リアルタイム・ログ
                                    </h3>
                                    <button 
                                        onClick={downloadJson}
                                        disabled={Object.keys(translatedData).length === 0}
                                        className="flex items-center gap-2 text-xs bg-emerald-600 hover:bg-emerald-500 disabled:opacity-30 px-3 py-1.5 rounded-md font-bold transition text-white"
                                    >
                                        <i data-lucide="download" className="w-4 h-4"></i>
                                        結果を保存
                                    </button>
                                </div>
                                <div className="flex-grow overflow-y-auto p-4 space-y-2 font-monospace text-xs leading-relaxed">
                                    {logs.map((log, i) => (
                                        <div key={i} className={`flex gap-2 p-1 rounded ${log.type === 'error' ? 'bg-rose-500/10 text-rose-300' : log.type === 'success' ? 'bg-emerald-500/10 text-emerald-300' : 'text-slate-400'}`}>
                                            <span className="opacity-40 shrink-0">[{log.time}]</span>
                                            <span className="break-all">{log.msg}</span>
                                        </div>
                                    ))}
                                    {logs.length === 0 && <div className="text-slate-600 italic text-center mt-10">ログはありません</div>}
                                </div>
                            </div>

                            <div className="space-y-6">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-lg">
                                    <h3 className="font-bold border-b border-slate-800 pb-2 text-sm flex items-center gap-2">
                                        <i data-lucide="help-circle" className="text-violet-400 w-4 h-4"></i>
                                        使い方
                                    </h3>
                                    <ul className="text-xs space-y-3 text-slate-400">
                                        <li className="flex gap-2">
                                            <i data-lucide="check" className="text-emerald-500 w-4 h-4 shrink-0"></i>
                                            <span>一度翻訳して英語が残ったファイルを再投入すると、そこだけ綺麗に日本語化します。</span>
                                        </li>
                                        <li className="flex gap-2">
                                            <i data-lucide="check" className="text-emerald-500 w-4 h-4 shrink-0"></i>
                                            <span>「召喚する」「到着」などの単語も、ゲームの文脈で翻訳します。</span>
                                        </li>
                                        <li className="flex gap-2">
                                            <i data-lucide="info" className="text-blue-400 w-4 h-4 shrink-0"></i>
                                            <span>GitHub Pagesなどで公開すると、スマホからも利用可能です。</span>
                                        </li>
                                    </ul>
                                </div>
                                
                                <div className="bg-gradient-to-br from-violet-900/20 to-slate-900 border border-violet-500/20 rounded-2xl p-5 shadow-lg">
                                    <p className="text-[10px] text-slate-500 leading-tight">
                                        ※このツールはブラウザ上で動作します。サーバーにデータが送信されることはありません（Gemini APIへのリクエストを除く）。
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
