<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sims4 JSON抽出ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* ボタンにホバー時の拡大効果を追加 */
        button, label {
            transform: scale(1);
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        button:hover, label:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.2);
        }
        /* カスタムのメッセージボックスのスタイル */
        #messageBox {
            animation: fade-in-out 3.5s forwards;
        }
        @keyframes fade-in-out {
            0% { opacity: 0; transform: translateY(10px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(10px); }
        }
    </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center p-4 text-gray-100">
    <div class="bg-gray-800 bg-opacity-80 p-8 rounded-3xl shadow-2xl w-full max-w-2xl backdrop-blur-sm">
        <h1 class="text-3xl font-extrabold mb-4 text-center text-teal-400">✨ Sims4 MOD JSON抽出ツール ✨</h1>
        <p class="text-sm text-gray-300 mb-6 text-center">
            翻訳したいJSONファイルをアップロードしてね！「Value」だけを抜き出して、<code class="bg-gray-700 text-gray-200 p-1 rounded-md">{ "原文": "" }</code> の形式に自動で変換するよ。
        </p>
        
        <div class="flex flex-col sm:flex-row items-center justify-center space-y-4 sm:space-y-0 sm:space-x-4 mb-6">
            <label for="fileInput" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full shadow-lg">
                ファイルを選択 📂
            </label>
            <input type="file" id="fileInput" accept=".json" class="hidden">
            
            <button id="downloadButton" onclick="downloadJSON()" class="bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 px-8 rounded-full shadow-lg">
                抽出結果を保存 💾
            </button>
        </div>

        <div class="result">
            <h3 class="text-lg font-semibold mb-2 text-gray-200">📝 抽出結果プレビュー</h3>
            <textarea id="output" readonly class="w-full h-80 p-4 border border-gray-600 rounded-xl bg-gray-700 text-gray-100 focus:outline-none focus:ring-2 focus:ring-teal-400 resize-none text-xs shadow-inner"></textarea>
            <div id="messageBox" class="mt-4 p-3 rounded-xl text-sm text-center font-medium opacity-0"></div>
        </div>
    </div>

<script>
    // グローバル変数を定義して、抽出されたデータを保持します
    let extracted = {};

    // メッセージボックスにメッセージを表示する関数
    function showMessage(message, type) {
        const messageBox = document.getElementById('messageBox');
        messageBox.textContent = message;
        messageBox.style.animation = 'none'; // アニメーションをリセット
        messageBox.offsetHeight; // リフローを強制
        messageBox.style.animation = '';

        if (type === 'success') {
            messageBox.className = 'mt-4 p-3 rounded-xl text-sm text-center font-medium bg-green-800 text-white opacity-100';
        } else if (type === 'error') {
            messageBox.className = 'mt-4 p-3 rounded-xl text-sm text-center font-medium bg-red-800 text-white opacity-100';
        } else {
            messageBox.className = 'mt-4 p-3 rounded-xl text-sm text-center font-medium bg-gray-600 text-gray-100 opacity-100';
        }
    }

    // ファイル入力の変更イベントをリッスンします
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                // ファイルの内容をJSONとしてパース
                const data = JSON.parse(e.target.result);
                // "Entries"キーまたはルート配列からデータを取得
                const entries = Array.isArray(data) ? data : (data.Entries || []);
                extracted = {};

                // 各エントリをループ処理し、「Value」を抽出
                entries.forEach(entry => {
                    if (entry.Value) {
                        extracted[entry.Value] = "";
                    }
                });

                // 結果を整形してテキストエリアに表示
                document.getElementById('output').value = JSON.stringify(extracted, null, 2);
                showMessage('JSONの抽出が完了しました！', 'success');
            } catch (err) {
                // JSONパースエラーを処理
                showMessage('JSONを正しく読み込めませんでした。😢 ファイルが有効なJSON形式であることを確認してね。', 'error');
                document.getElementById('output').value = '';
            }
        };
        // ファイルの内容をテキストとして読み込み
        reader.readAsText(file, "UTF-8");
    });

    // 抽出結果をJSONファイルとしてダウンロードする関数
    function downloadJSON() {
        // 抽出されたデータがない場合は警告
        if (!Object.keys(extracted).length) {
            showMessage("まだ抽出結果がありません。先にJSONファイルをアップロードしてね！", 'error');
            return;
        }

        // Blobオブジェクトを作成してダウンロードリンクを生成
        const blob = new Blob([JSON.stringify(extracted, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "extracted_texts.json";
        
        // 仮想クリックでダウンロードを開始
        document.body.appendChild(a);
        a.click();
        
        // URLオブジェクトを解放
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        
        showMessage("JSONファイルのダウンロードを開始しました！", 'success');
    }
</script>
</body>
</html>
